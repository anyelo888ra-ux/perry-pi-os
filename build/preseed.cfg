d-i debian-installer/locale string es_ES.UTF-8
d-i keyboard-configuration/xkb-keymap select es
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string perry-pi-os
d-i netcfg/get_domain string local
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string

# Cuenta inicial: el usuario perry se crea durante la instalación.
# No se incluyen contraseñas públicas o predeterminadas: el instalador las solicitará.
d-i passwd/user-fullname string Perry User
d-i passwd/username string perry

# Particionado 100% automático sin aviso de swap
d-i partman-auto/disk string /dev/sda
d-i partman-auto/method string regular
d-i partman-auto/expert_recipe string root :: 1500 50 -1 ext4 $primary{ } $bootable{ } method{ format } format{ } use_filesystem{ } filesystem{ ext4 } mountpoint{ / } .
d-i partman-basicfilesystems/no_swap boolean false
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

# Paquetes: Escritorio ligero, MicroPython, Python3, Navegador, Tkinter y Voz (espeak-ng)
tasksel tasksel/first multiselect standard
d-i pkgsel/include string xorg openbox lxterminal pcmanfm tint2 micropython python3 python3-tk espeak-ng netsurf-gtk lightdm sudo
popularity-contest popularity-contest/participate boolean false

# GRUB automático
d-i grub-installer/only_debian boolean true
d-i grub-installer/bootdev string /dev/sda

# Configuración final de Perry Pi OS y Asistente Yonata
d-i preseed/late_command string \
  in-target sed -i 's/GRUB_CMDLINE_LINUX_DEFAULT=.*/GRUB_CMDLINE_LINUX_DEFAULT=""/' /etc/default/grub; \
  in-target sed -i 's/GRUB_TIMEOUT=.*/GRUB_TIMEOUT=1/' /etc/default/grub; \
  in-target update-grub; \
  mkdir -p /target/etc/lightdm/lightdm.conf.d; \
  printf "[Seat:*]\nautologin-user=perry\nautologin-user-timeout=0\n" > /target/etc/lightdm/lightdm.conf.d/autologin.conf; \
  printf 'PRETTY_NAME="Perry Pi OS 1.0 (Web & VM Edition)"\nNAME="Perry Pi OS"\nID=perrypios\nID_LIKE=debian\n' > /target/etc/os-release; \
  cat << 'PYEOF' > /target/usr/local/bin/yonata-welcome.py
import tkinter as tk
from tkinter import ttk
import subprocess, threading, platform, os

FLAG_FILE = os.path.expanduser("~/.perry_welcome_done")

def hablar(texto):
    threading.Thread(target=lambda: subprocess.run(["espeak-ng", "-v", "es", "-s", "145", texto]), daemon=True).start()

class YonataApp:
    def __init__(self, root):
        self.root = root
        self.root.title("Yonata - Asistente de Perry Pi OS")
        self.root.geometry("540x400")
        self.root.configure(bg="#0f172a")
        self.root.resizable(False, False)

        self.canvas = tk.Canvas(root, width=100, height=100, bg="#0f172a", highlightthickness=0)
        self.canvas.pack(pady=(25, 10))
        self.outer = self.canvas.create_oval(10, 10, 90, 90, outline="#38bdf8", width=4)
        self.inner = self.canvas.create_oval(25, 25, 75, 75, fill="#0284c7", outline="")

        self.lbl_title = tk.Label(root, text="Hola, soy Yonata", font=("Sans", 18, "bold"), fg="#f8fafc", bg="#0f172a")
        self.lbl_title.pack()

        self.lbl_desc = tk.Label(root, text="Preparando Perry Pi OS para tu primera sesión...", font=("Sans", 11), fg="#94a3b8", bg="#0f172a", wraplength=460)
        self.lbl_desc.pack(pady=10)

        self.progress = ttk.Progressbar(root, orient="horizontal", length=380, mode="determinate")
        self.progress.pack(pady=15)

        self.btn_action = tk.Button(root, text="Iniciar verificación", font=("Sans", 11, "bold"), bg="#10b981", fg="white", relief="flat", padx=20, pady=8, command=self.iniciar_flujo)
        self.btn_action.pack(pady=10)

        self.animar(0)
        self.root.after(600, lambda: hablar("Hola, soy Yonata, tu asistente de Perry Pi OS. Pulsa iniciar para verificar el sistema."))

    def animar(self, step):
        delta = 4 if (step % 20) < 10 else -4
        self.canvas.coords(self.outer, 10 - delta/2, 10 - delta/2, 90 + delta/2, 90 + delta/2)
        self.root.after(80, lambda: self.animar(step + 1))

    def iniciar_flujo(self):
        self.btn_action.config(state="disabled")
        arq = platform.machine()
        modo = "Edición Web x86 (32-bit)" if "86" in arq and "64" not in arq else "Edición VM Completa"
        self.lbl_desc.config(text=f"Detectado: {modo}\nVerificando MicroPython, Python 3 y actualizaciones...")
        hablar("Verificando paquetes, MicroPython y estado del sistema.")
        self.progress["value"] = 50
        self.root.update()
        self.root.after(2000, self.completar)

    def completar(self):
        self.progress["value"] = 100
        self.lbl_title.config(text="¡Perry Pi OS está listo!")
        self.lbl_desc.config(text="Todo verificado. Ya puedes usar el navegador, terminal y MicroPython.")
        hablar("Todo está listo. Bienvenido a Perry Pi OS.")
        with open(FLAG_FILE, "w") as f:
            f.write("ok")
        self.btn_action.config(text="Ir al Escritorio →", bg="#3b82f6", state="normal", command=self.cerrar)

    def cerrar(self):
        self.root.destroy()

if __name__ == "__main__":
    root = tk.Tk()
    app = YonataApp(root)
    root.mainloop()
PYEOF
  chmod +x /target/usr/local/bin/yonata-welcome.py; \
  mkdir -p /target/home/perry/.config/openbox; \
  printf 'tint2 &\n(sleep 2 && netsurf-gtk) &\nif [ ! -f "$HOME/.perry_welcome_done" ]; then\n    python3 /usr/local/bin/yonata-welcome.py &\nfi\n' > /target/home/perry/.config/openbox/autostart; \
  in-target chown -R perry:perry /home/perry/.config; \
  in-target apt-get clean

d-i finish-install/reboot_in_progress note
d-i debian-installer/exit/poweroff boolean true
