<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Capturas de Perry Pi OS próximamente</title>
  <desc id="desc">Ilustración de un escritorio Linux estilizado con una ventana y el anuncio de que las capturas oficiales estarán disponibles pronto.</desc>
