<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0b1220">
  <meta name="robots" content="noindex">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <title>404 — Página no encontrada | Perry Pi OS</title>
  <style>
    :root{color-scheme:dark;--bg:#0b1220;--panel:#142238;--line:#2b405b;--text:#edf5ff;--muted:#9aabc0;--red:#ef476f;--blue:#63c9ff}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 50% 0,#1c3854,transparent 55%),var(--bg);color:var(--text);font:16px/1.6 system-ui,sans-serif}.card{width:min(620px,100%);text-align:center;padding:clamp(26px,6vw,52px);border:1px solid var(--line);border-radius:22px;background:#142238eF;box-shadow:0 25px 80px #0006}.berry{font-size:2.2rem}.code{font-size:clamp(5rem,20vw,9rem);line-height:1;font-weight:900;letter-spacing:-.08em;color:var(--red);margin:12px 0}.label{display:inline-block;border:1px solid #ef476f55;background:#ef476f18;color:#ff9bb0;padding:5px 12px;border-radius:999px;font-size:.75rem;font-weight:800;letter-spacing:.08em}.card h1{font-size:1.6rem;margin:17px 0 8px}.card p{color:var(--muted);margin:0 auto 24px;max-width:440px}.actions{display:flex;justify-content:center;flex-wrap:wrap;gap:10px}.btn{display:inline-flex;justify-content:center;align-items:center;padding:11px 17px;border-radius:10px;background:var(--red);color:white;text-decoration:none;font-weight:800}.btn.alt{background:#20354d;border:1px solid var(--line)}.foot{margin-top:25px;color:#71849a;font-size:.8rem}
  </style>
</head>
<body>
  <main class="card">
    <div class="berry" aria-hidden="true">🍓</div>
    <span class="label">PERRY PI OS · ERROR 404</span>
    <div class="code">404</div>
    <h1>Esta página se perdió en el sistema.</h1>
    <p>La dirección puede haber cambiado o el archivo ya no existe. Vuelve al centro de Perry Pi OS para continuar.</p>
    <div class="actions"><a class="btn" href="index.html">← Volver al inicio</a><a class="btn alt" href="https://github.com/anyelo888ra-ux/perry-pi-os/issues">Reportar un enlace roto</a></div>
    <div class="foot">Perry Pi OS · Debian 12 · Proyecto independiente</div>
  </main>
</body>
</html>
