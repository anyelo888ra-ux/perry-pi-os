name: Publicar Web en GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "web/**"
      - ".github/workflows/deploy-web.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "web/**"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  validate:
    name: Validar demo y servidor web
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Comprobar archivos y sintaxis
        run: |
          set -euo pipefail
          test -f web/index.html
          test -f web/demo.html
          test -f web/libv86.js
          test -f web/v86.wasm
          test -f web/seabios.bin
          test -f web/vgabios.bin
          python3 -m py_compile web/app.py

  deploy:
    needs: validate
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Verificar carpeta web
        run: |
          ls -la web
          test -f web/demo.html

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir carpeta web como artefacto de Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: "web"

      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
