name: Compilar Perry Pi OS (Web 32-bit, ISO 64-bit y Normal 64-bit)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "build/**"
      - ".github/workflows/build-os.yml"

permissions:
  contents: write

jobs:
  build-web-32bit:
    name: 1. Compilar Web 32-bit (i386 + Yonata)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar herramientas
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq debootstrap debian-archive-keyring grub-pc-bin parted dosfstools

      - name: Construir perry-pi-os-web.img
        run: |
          set -e
          dd if=/dev/zero of=perry-pi-os-web.img bs=1M count=1400 status=none
          parted -s perry-pi-os-web.img mklabel msdos
          parted -s perry-pi-os-web.img mkpart primary ext4 1MiB 100%
          parted -s perry-pi-os-web.img set 1 boot on

          LOOP_DEV=$(sudo losetup --find --show --partscan perry-pi-os-web.img)
          PART_DEV="${LOOP_DEV}p1"
          sudo mkfs.ext4 -F "$PART_DEV"

          mkdir -p mnt
          sudo mount "$PART_DEV" mnt
          sudo debootstrap --arch=i386 --variant=minbase bookworm mnt http://deb.debian.org/debian

          sudo mount --bind /dev mnt/dev
          sudo mount --bind /proc mnt/proc
          sudo mount --bind /sys mnt/sys

          cat << 'PYEOF' > yonata.py
          import tkinter as tk
          from tkinter import ttk
          import subprocess, threading, platform, os

          FLAG = os.path.expanduser("~/.perry_welcome_done")

          def hablar(t):
              threading.Thread(
                  target=lambda: subprocess.run(["espeak-ng", "-v", "es", "-s", "145", t], check=False),
                  daemon=True
              ).start()

          class Yonata:
              def __init__(self, r):
                  self.r = r
                  r.title("Yonata - Asistente Perry Pi OS")
                  r.geometry("520x380")
                  r.configure(bg="#0f172a")
                  tk.Label(r, text="Hola, soy Yonata", font=("Sans", 18, "bold"), fg="#38bdf8", bg="#0f172a").pack(pady=(35, 10))
                  self.desc = tk.Label(r, text="Preparando Perry Pi OS...", font=("Sans", 11), fg="#e2e8f0", bg="#0f172a")
                  self.desc.pack(pady=10)
                  self.pb = ttk.Progressbar(r, length=360, mode="determinate")
                  self.pb.pack(pady=15)
                  self.btn = tk.Button(
                      r, text="Verificar Sistema", bg="#10b981", fg="#fff",
                      font=("Sans", 11, "bold"), relief="flat", padx=20, pady=8, command=self.run
                  )
                  self.btn.pack(pady=10)
                  r.after(500, lambda: hablar("Hola, soy Yonata, tu asistente de Perry Pi OS."))

              def run(self):
                  self.btn.config(state="disabled")
                  self.desc.config(text=f"Arquitectura: {platform.machine()} | Verificando MicroPython y Python 3...")
                  hablar("Verificando MicroPython y componentes del sistema.")
                  self.pb["value"] = 60
                  self.r.after(1800, self.done)

              def done(self):
                  self.pb["value"] = 100
                  self.desc.config(text="¡Perry Pi OS verificado y listo para usar!")
                  hablar("Todo está listo. Bienvenido a Perry Pi OS.")
                  with open(FLAG, "w", encoding="utf-8") as f:
                      f.write("ok")
                  self.btn.config(text="Ir al Escritorio", bg="#3b82f6", state="normal", command=self.r.destroy)

          if __name__ == "__main__":
              root = tk.Tk()
              Yonata(root)
              root.mainloop()
          PYEOF

          sudo cp yonata.py mnt/usr/local/bin/yonata-welcome.py

          sudo chroot mnt /bin/bash -s "$LOOP_DEV" << 'CHROOTEOF'
          set -e
          export DEBIAN_FRONTEND=noninteractive
          LOOP_DEV="$1"

          echo "perry-pi-os" > /etc/hostname
          printf 'PRETTY_NAME="Perry Pi OS 1.0 (Web 32-bit)"\nNAME="Perry Pi OS"\nID=perrypios\n' > /etc/os-release

          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            linux-image-686 grub-pc xorg openbox lxterminal pcmanfm tint2 \
            micropython python3 python3-tk espeak-ng netsurf-gtk lightdm sudo ca-certificates

          sed -i 's/GRUB_CMDLINE_LINUX_DEFAULT=.*/GRUB_CMDLINE_LINUX_DEFAULT=""/' /etc/default/grub
          sed -i 's/GRUB_TIMEOUT=.*/GRUB_TIMEOUT=1/' /etc/default/grub

          id -u perry >/dev/null 2>&1 || useradd -m -s /bin/bash -G sudo perry
          echo "perry:perry" | chpasswd
          echo "root:perry" | chpasswd

          mkdir -p /etc/lightdm/lightdm.conf.d /home/perry/.config/openbox
          printf '[Seat:*]\nautologin-user=perry\nautologin-user-timeout=0\n' > /etc/lightdm/lightdm.conf.d/autologin.conf
          printf 'tint2 &\n[ ! -f "$HOME/.perry_welcome_done" ] && python3 /usr/local/bin/yonata-welcome.py &\n' > /home/perry/.config/openbox/autostart
          chmod +x /usr/local/bin/yonata-welcome.py
          chown -R perry:perry /home/perry/.config

          grub-install --target=i386-pc --boot-directory=/boot "$LOOP_DEV"
          update-grub
          apt-get clean
          rm -rf /var/lib/apt/lists/*
          CHROOTEOF

          sudo umount -lf mnt/dev mnt/proc mnt/sys mnt 2>/dev/null || true
          sudo losetup -d "$LOOP_DEV"

      - name: Subir artefacto Web 32-bit
        uses: actions/upload-artifact@v4
        with:
          name: perry-pi-os-web
          path: perry-pi-os-web.img

  build-iso-64bit:
    name: 2. Compilar Local ISO 64-bit (amd64 + Chromium + Yonata)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar live-build y herramientas
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq live-build debian-archive-keyring squashfs-tools xorriso

      - name: Compilar perry-pi-os-local-x64.iso
        run: |
          set -e
          mkdir -p iso-build/config/package-lists iso-build/config/includes.chroot_after_packages/usr/local/bin iso-build/config/includes.chroot_after_packages/etc/lightdm/lightdm.conf.d iso-build/config/includes.chroot_after_packages/home/perry/.config/openbox
          cd iso-build

          lb config --mode debian --architecture amd64 --distribution bookworm \
            --mirror-bootstrap http://deb.debian.org/debian \
            --mirror-chroot http://deb.debian.org/debian \
            --mirror-binary http://deb.debian.org/debian \
            --binary-images iso-hybrid \
            --bootappend-live "boot=live components username=perry hostname=perry-pi-os"

          cat << 'EOF' > config/package-lists/perry.list.chroot
          xorg openbox lxterminal pcmanfm tint2 chromium micropython python3 python3-tk espeak-ng lightdm sudo
          EOF

          cat << 'PYEOF' > config/includes.chroot_after_packages/usr/local/bin/yonata-welcome.py
          import tkinter as tk
          from tkinter import ttk
          import subprocess, threading, platform, os

          FLAG = os.path.expanduser("~/.perry_welcome_done")

          def hablar(t):
              threading.Thread(
                  target=lambda: subprocess.run(["espeak-ng", "-v", "es", "-s", "145", t], check=False),
                  daemon=True
              ).start()

          class Yonata:
              def __init__(self, r):
                  self.r = r
                  r.title("Yonata - Asistente Perry Pi OS")
                  r.geometry("520x380")
                  r.configure(bg="#0f172a")
                  tk.Label(r, text="Hola, soy Yonata", font=("Sans", 18, "bold"), fg="#38bdf8", bg="#0f172a").pack(pady=(35, 10))
                  self.desc = tk.Label(r, text="Preparando Perry Pi OS...", font=("Sans", 11), fg="#e2e8f0", bg="#0f172a")
                  self.desc.pack(pady=10)
                  self.pb = ttk.Progressbar(r, length=360, mode="determinate")
                  self.pb.pack(pady=15)
                  self.btn = tk.Button(
                      r, text="Verificar Sistema", bg="#10b981", fg="#fff",
                      font=("Sans", 11, "bold"), relief="flat", padx=20, pady=8, command=self.run
                  )
                  self.btn.pack(pady=10)
                  r.after(500, lambda: hablar("Hola, soy Yonata, tu asistente de Perry Pi OS."))

              def run(self):
                  self.btn.config(state="disabled")
                  self.desc.config(text=f"Arquitectura: {platform.machine()} | Verificando MicroPython y Python 3...")
                  hablar("Verificando MicroPython y componentes del sistema.")
                  self.pb["value"] = 60
                  self.r.after(1800, self.done)

              def done(self):
                  self.pb["value"] = 100
                  self.desc.config(text="¡Perry Pi OS verificado y listo para usar!")
                  hablar("Todo está listo. Bienvenido a Perry Pi OS.")
                  with open(FLAG, "w", encoding="utf-8") as f:
                      f.write("ok")
                  self.btn.config(text="Ir al Escritorio", bg="#3b82f6", state="normal", command=self.r.destroy)

          if __name__ == "__main__":
              root = tk.Tk()
              Yonata(root)
              root.mainloop()
          PYEOF

          chmod +x config/includes.chroot_after_packages/usr/local/bin/yonata-welcome.py
          printf '[Seat:*]\nautologin-user=perry\nautologin-user-timeout=0\n' > config/includes.chroot_after_packages/etc/lightdm/lightdm.conf.d/autologin.conf
          printf 'tint2 &\n[ ! -f "$HOME/.perry_welcome_done" ] && python3 /usr/local/bin/yonata-welcome.py &\n' > config/includes.chroot_after_packages/home/perry/.config/openbox/autostart

          sudo lb build
          mv live-image-amd64.hybrid.iso ../perry-pi-os-local-x64.iso

      - name: Subir artefacto ISO 64-bit
        uses: actions/upload-artifact@v4
        with:
          name: perry-pi-os-iso
          path: perry-pi-os-local-x64.iso

  build-normal-64bit:
    name: 3. Compilar Normal 64-bit (amd64 Disco Instalado)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar herramientas
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq debootstrap debian-archive-keyring grub-pc-bin parted dosfstools

      - name: Construir perry-pi-os-normal-x64.img
        run: |
          set -e
          dd if=/dev/zero of=perry-pi-os-normal-x64.img bs=1M count=2500 status=none
          parted -s perry-pi-os-normal-x64.img mklabel msdos
          parted -s perry-pi-os-normal-x64.img mkpart primary ext4 1MiB 100%
          parted -s perry-pi-os-normal-x64.img set 1 boot on

          LOOP_DEV=$(sudo losetup --find --show --partscan perry-pi-os-normal-x64.img)
          PART_DEV="${LOOP_DEV}p1"
          sudo mkfs.ext4 -F "$PART_DEV"

          mkdir -p mnt
          sudo mount "$PART_DEV" mnt
          sudo debootstrap --arch=amd64 --variant=minbase bookworm mnt http://deb.debian.org/debian

          sudo mount --bind /dev mnt/dev
          sudo mount --bind /proc mnt/proc
          sudo mount --bind /sys mnt/sys

          sudo chroot mnt /bin/bash -s "$LOOP_DEV" << 'CHROOTEOF'
          set -e
          export DEBIAN_FRONTEND=noninteractive
          LOOP_DEV="$1"

          echo "perry-pi-os" > /etc/hostname
          printf 'PRETTY_NAME="Perry Pi OS 1.0 (Normal 64-bit)"\nNAME="Perry Pi OS"\nID=perrypios\n' > /etc/os-release

          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            linux-image-amd64 grub-pc xorg openbox lxterminal pcmanfm tint2 \
            micropython python3 python3-tk espeak-ng lightdm sudo ca-certificates

          sed -i 's/GRUB_CMDLINE_LINUX_DEFAULT=.*/GRUB_CMDLINE_LINUX_DEFAULT=""/' /etc/default/grub
          sed -i 's/GRUB_TIMEOUT=.*/GRUB_TIMEOUT=1/' /etc/default/grub

          id -u perry >/dev/null 2>&1 || useradd -m -s /bin/bash -G sudo perry
          echo "perry:perry" | chpasswd
          echo "root:perry" | chpasswd

          mkdir -p /etc/lightdm/lightdm.conf.d
          printf '[Seat:*]\nautologin-user=perry\nautologin-user-timeout=0\n' > /etc/lightdm/lightdm.conf.d/autologin.conf

          grub-install --target=i386-pc --boot-directory=/boot "$LOOP_DEV"
          update-grub
          apt-get clean
          rm -rf /var/lib/apt/lists/*
          CHROOTEOF

          sudo umount -lf mnt/dev mnt/proc mnt/sys mnt 2>/dev/null || true
          sudo losetup -d "$LOOP_DEV"

      - name: Subir artefacto Normal 64-bit
        uses: actions/upload-artifact@v4
        with:
          name: perry-pi-os-normal
          path: perry-pi-os-normal-x64.img

  publish-release:
    name: 4. Publicar todo en GitHub Releases
    needs: [build-web-32bit, build-iso-64bit, build-normal-64bit]
    runs-on: ubuntu-latest
    steps:
      - name: Descargar artefactos compilados
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publicar en Release (latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Perry Pi OS - Última Compilación
          draft: false
          prerelease: false
          files: release-assets/*
