name: Compilar Perry Pi OS (Web 32-bit, ISO 64-bit y Normal 64-bit)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "build/**"
      - ".github/workflows/build-os.yml"
      - "wallpaper.png"
  pull_request:
    branches:
      - main
    paths:
      - "build/**"
      - ".github/workflows/build-os.yml"
      - "wallpaper.png"

permissions:
  contents: read

jobs:
  build-web-32bit:
    name: 1. Compilar Web 32-bit (i386 + Yonata)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar herramientas
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq debootstrap debian-archive-keyring grub-pc-bin parted dosfstools e2fsprogs curl

      - name: Preparar wallpaper y scripts base
        run: |
          set -euo pipefail
          if [ ! -f "wallpaper.png" ]; then
            curl -fsSL "https://raw.githubusercontent.com/anyelo888ra-ux/perry-pi-os/main/wallpaper.png" -o wallpaper.png
          fi

          python3 -m py_compile build/yonata-welcome.py build/perry-explorer.py build/perry-panel.py
                    cp build/yonata-welcome.py yonata.py
          cp build/perry-explorer.py perry-explorer.py
          cp build/perry-panel.py perry-panel.py


      - name: Construir perry-pi-os-web.img
        run: |
          set -euo pipefail
          IMG="perry-pi-os-web.img"
          LOOP_DEV=""

          cleanup() {
            set +e
            for d in run sys proc dev/pts dev; do
              sudo umount -lf "mnt/$d" 2>/dev/null || true
            done
            sudo umount -lf mnt 2>/dev/null || true
            if [ -n "${LOOP_DEV:-}" ]; then
              sudo losetup -d "$LOOP_DEV" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT

          dd if=/dev/zero of="$IMG" bs=1M count=2400 status=none
          parted -s "$IMG" mklabel msdos
          parted -s "$IMG" mkpart primary ext4 1MiB 100%
          parted -s "$IMG" set 1 boot on

          LOOP_DEV=$(sudo losetup --find --show --partscan "$IMG")
          PART_DEV="${LOOP_DEV}p1"
          sudo mkfs.ext4 -F -L "PERRY_WEB32" "$PART_DEV"

          mkdir -p mnt
          sudo mount "$PART_DEV" mnt

          sudo debootstrap --arch=i386 --variant=minbase bookworm mnt http://deb.debian.org/debian

          for d in dev dev/pts proc sys run; do
            sudo mount --bind "/$d" "mnt/$d"
          done

          sudo mkdir -p mnt/usr/share/backgrounds/perry-pi-os mnt/usr/local/bin
          sudo cp wallpaper.png mnt/usr/share/backgrounds/perry-pi-os/wallpaper.png
          sudo cp yonata.py mnt/usr/local/bin/yonata-welcome.py
          sudo cp perry-explorer.py mnt/usr/local/bin/perry-explorer.py
          sudo cp perry-panel.py mnt/usr/local/bin/perry-panel.py

          sudo chroot mnt /bin/bash -s "$LOOP_DEV" "$PART_DEV" << 'CHROOTEOF'
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          LOOP_DEV="$1"
          PART_DEV="$2"

          echo "perry-pi-os" > /etc/hostname
          printf 'PRETTY_NAME="Perry Pi OS 1.0 (Web 32-bit)"\nNAME="Perry Pi OS"\nID=perrypios\n' > /etc/os-release

          apt-get update -qq
          apt-get install -y -qq --no-install-recommends linux-image-686
          apt-get clean
          apt-get install -y -qq --no-install-recommends \
            grub-pc xorg openbox lxterminal pcmanfm tint2 mousepad netsurf-gtk \
            galculator viewnior htop feh procps \
            python3 python3-tk espeak-ng lightdm sudo ca-certificates dbus-x11 locales x11-xkb-utils xarchiver lxappearance lxpolkit

          sed -i 's/GRUB_CMDLINE_LINUX_DEFAULT=.*/GRUB_CMDLINE_LINUX_DEFAULT="console=ttyS0,115200 console=tty0"/' /etc/default/grub
          sed -i 's/GRUB_TIMEOUT=.*/GRUB_TIMEOUT=1/' /etc/default/grub

          id -u perry-system >/dev/null 2>&1 || useradd -m -s /bin/bash -G sudo perry-system
          TEMP_PASSWORD="$(od -An -N24 -tx1 /dev/urandom | tr -d '[:space:]')"
          printf 'perry-system:%s\n' "$TEMP_PASSWORD" | chpasswd
          unset TEMP_PASSWORD
          echo "perry-system ALL=(ALL) NOPASSWD:ALL" > /etc/sudoers.d/perry-system
          chmod 0440 /etc/sudoers.d/perry-system

          mkdir -p /etc/lightdm/lightdm.conf.d /home/perry-system/.config/openbox /home/perry-system/Desktop
          printf '[Seat:*]\nautologin-user=perry-system\nautologin-user-timeout=0\nuser-session=openbox\n' > /etc/lightdm/lightdm.conf.d/99-perry.conf

          cat << 'AUTOEOF' > /home/perry-system/.config/openbox/autostart
          python3 /usr/local/bin/perry-explorer.py &
          if [ ! -f "$HOME/.perry_welcome_done" ]; then
            python3 /usr/local/bin/yonata-welcome.py &
          fi
          AUTOEOF

          cat << 'DESKEOF' > /home/perry-system/Desktop/Yonata.desktop
          [Desktop Entry]
          Type=Application
          Name=Yonata Instalador
          Exec=python3 /usr/local/bin/yonata-welcome.py
          Icon=utilities-terminal
          Terminal=false
          DESKEOF

          chmod +x /usr/local/bin/yonata-welcome.py /usr/local/bin/perry-explorer.py /usr/local/bin/perry-panel.py /home/perry-system/Desktop/Yonata.desktop
          chown -R perry-system:perry-system /home/perry-system

          grub-install --target=i386-pc --boot-directory=/boot "$LOOP_DEV"
          update-grub

          UUID=$(blkid -s UUID -o value "$PART_DEV" || true)
          if [ -n "$UUID" ] && [ ! -s /boot/grub/grub.cfg ]; then
            cat << GRUBEOF > /boot/grub/grub.cfg
          set default=0
          set timeout=1
          serial --unit=0 --speed=115200
          terminal_input serial console
          terminal_output serial console
          menuentry "Perry Pi OS (Web 32-bit)" {
              search --no-floppy --fs-uuid --set=root $UUID
              linux /boot/vmlinuz-6.1.0-50-686 root=UUID=$UUID ro console=ttyS0,115200 console=tty0
              initrd /boot/initrd.img-6.1.0-50-686
          }
          GRUBEOF
          fi

          apt-get clean
          rm -rf /var/lib/apt/lists/*
          CHROOTEOF

      - name: Subir artefacto Web 32-bit
        uses: actions/upload-artifact@v4
        with:
          name: perry-pi-os-web
          path: perry-pi-os-web.img

  build-iso-64bit:
    name: 2. Compilar Local ISO 64-bit (amd64 + Chromium + Apps + Yonata)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar live-build y herramientas
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq live-build debian-archive-keyring squashfs-tools xorriso curl isolinux syslinux-common

      - name: Compilar perry-pi-os-local-x64.iso
        run: |
          set -euo pipefail
          if [ ! -f "wallpaper.png" ]; then
            curl -fsSL "https://raw.githubusercontent.com/anyelo888ra-ux/perry-pi-os/main/wallpaper.png" -o wallpaper.png
          fi

          rm -rf iso-build
          mkdir -p iso-build/config/package-lists \
            iso-build/config/includes.chroot_after_packages/usr/local/bin \
            iso-build/config/includes.chroot_after_packages/usr/share/backgrounds/perry-pi-os \
            iso-build/config/includes.chroot_after_packages/etc/lightdm/lightdm.conf.d \
            iso-build/config/includes.chroot_after_packages/etc/sudoers.d \
            iso-build/config/includes.chroot_after_packages/home/perry-system/.config/openbox \
            iso-build/config/includes.chroot_after_packages/home/perry-system/Desktop
          cd iso-build

          lb config --mode debian --architecture amd64 --distribution bookworm \
            --mirror-bootstrap http://deb.debian.org/debian \
            --mirror-chroot http://deb.debian.org/debian \
            --mirror-binary http://deb.debian.org/debian \
            --security false \
            --apt-indices false \
            --linux-packages "none" \
            --binary-images iso-hybrid \
            --bootappend-live "boot=live components username=perry-system hostname=perry-pi-os"

          echo 'APT_INDICES="false"' >> config/chroot

          cat << 'EOF' > config/package-lists/perry.list.chroot
          linux-image-amd64 xorg openbox lxterminal pcmanfm tint2 mousepad chromium galculator viewnior htop feh procps python3 python3-tk espeak-ng lightdm sudo dbus-x11 locales x11-xkb-utils xarchiver lxappearance lxpolkit
          EOF

          cp ../wallpaper.png config/includes.chroot_after_packages/usr/share/backgrounds/perry-pi-os/wallpaper.png

          cp ../build/yonata-welcome.py config/includes.chroot_after_packages/usr/local/bin/yonata-welcome.py
          cp ../build/perry-explorer.py config/includes.chroot_after_packages/usr/local/bin/perry-explorer.py
          cp ../build/perry-panel.py config/includes.chroot_after_packages/usr/local/bin/perry-panel.py


          echo "perry-system ALL=(ALL) NOPASSWD:ALL" > config/includes.chroot_after_packages/etc/sudoers.d/perry-system
          chmod 0440 config/includes.chroot_after_packages/etc/sudoers.d/perry-system
          printf '[Seat:*]\nautologin-user=perry-system\nautologin-user-timeout=0\nuser-session=openbox\n' > config/includes.chroot_after_packages/etc/lightdm/lightdm.conf.d/99-perry.conf

          cat << 'AUTOEOF' > config/includes.chroot_after_packages/home/perry-system/.config/openbox/autostart
          python3 /usr/local/bin/perry-explorer.py &
          if [ ! -f "$HOME/.perry_welcome_done" ]; then
            python3 /usr/local/bin/yonata-welcome.py &
          fi
          AUTOEOF

          cat << 'DESKEOF' > config/includes.chroot_after_packages/home/perry-system/Desktop/Yonata.desktop
          [Desktop Entry]
          Type=Application
          Name=Yonata Instalador
          Exec=python3 /usr/local/bin/yonata-welcome.py
          Icon=utilities-terminal
          Terminal=false
          DESKEOF

          chmod +x config/includes.chroot_after_packages/usr/local/bin/yonata-welcome.py \
                   config/includes.chroot_after_packages/usr/local/bin/perry-explorer.py \
                   config/includes.chroot_after_packages/home/perry-system/Desktop/Yonata.desktop

          sudo lb build
          mv live-image-amd64.hybrid.iso ../perry-pi-os-local-x64.iso

      - name: Subir artefacto ISO 64-bit
        uses: actions/upload-artifact@v4
        with:
          name: perry-pi-os-iso
          path: perry-pi-os-local-x64.iso

  build-normal-64bit:
    name: 3. Compilar Normal 64-bit (amd64 Disco Instalado)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar herramientas
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq debootstrap debian-archive-keyring grub-pc-bin parted dosfstools e2fsprogs curl

      - name: Construir perry-pi-os-normal-x64.img
        run: |
          set -euo pipefail
          IMG="perry-pi-os-normal-x64.img"
          LOOP_DEV=""

          if [ ! -f "wallpaper.png" ]; then
            curl -fsSL "https://raw.githubusercontent.com/anyelo888ra-ux/perry-pi-os/main/wallpaper.png" -o wallpaper.png
          fi

          cleanup() {
            set +e
            for d in run sys proc dev/pts dev; do
              sudo umount -lf "mnt/$d" 2>/dev/null || true
            done
            sudo umount -lf mnt 2>/dev/null || true
            if [ -n "${LOOP_DEV:-}" ]; then
              sudo losetup -d "$LOOP_DEV" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT

          dd if=/dev/zero of="$IMG" bs=1M count=2600 status=none
          parted -s "$IMG" mklabel msdos
          parted -s "$IMG" mkpart primary ext4 1MiB 100%
          parted -s "$IMG" set 1 boot on

          LOOP_DEV=$(sudo losetup --find --show --partscan "$IMG")
          PART_DEV="${LOOP_DEV}p1"
          sudo mkfs.ext4 -F -L "PERRY_X64" "$PART_DEV"

          mkdir -p mnt
          sudo mount "$PART_DEV" mnt

          sudo debootstrap --arch=amd64 --variant=minbase bookworm mnt http://deb.debian.org/debian

          for d in dev dev/pts proc sys run; do
            sudo mount --bind "/$d" "mnt/$d"
          done

          sudo mkdir -p mnt/usr/share/backgrounds/perry-pi-os mnt/usr/local/bin
          sudo cp wallpaper.png mnt/usr/share/backgrounds/perry-pi-os/wallpaper.png

          sudo cp build/yonata-welcome.py mnt/usr/local/bin/yonata-welcome.py
          sudo cp build/perry-explorer.py mnt/usr/local/bin/perry-explorer.py
          sudo cp build/perry-panel.py mnt/usr/local/bin/perry-panel.py


          sudo chroot mnt /bin/bash -s "$LOOP_DEV" "$PART_DEV" << 'CHROOTEOF'
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          LOOP_DEV="$1"
          PART_DEV="$2"

          echo "perry-pi-os" > /etc/hostname
          printf 'PRETTY_NAME="Perry Pi OS 1.0 (Normal 64-bit)"\nNAME="Perry Pi OS"\nID=perrypios\n' > /etc/os-release

          apt-get update -qq
          apt-get install -y -qq --no-install-recommends linux-image-amd64
          apt-get clean
          apt-get install -y -qq --no-install-recommends \
            grub-pc xorg openbox lxterminal pcmanfm tint2 mousepad chromium \
            galculator viewnior htop feh procps \
            python3 python3-tk espeak-ng lightdm sudo ca-certificates dbus-x11 \
            locales x11-xkb-utils xarchiver lxappearance lxpolkit

          sed -i 's/GRUB_CMDLINE_LINUX_DEFAULT=.*/GRUB_CMDLINE_LINUX_DEFAULT="console=ttyS0,115200 console=tty0"/' /etc/default/grub
          sed -i 's/GRUB_TIMEOUT=.*/GRUB_TIMEOUT=1/' /etc/default/grub

          id -u perry-system >/dev/null 2>&1 || useradd -m -s /bin/bash -G sudo perry-system
          TEMP_PASSWORD="$(od -An -N24 -tx1 /dev/urandom | tr -d '[:space:]')"
          printf 'perry-system:%s\n' "$TEMP_PASSWORD" | chpasswd
          unset TEMP_PASSWORD
          echo "perry-system ALL=(ALL) NOPASSWD:ALL" > /etc/sudoers.d/perry-system
          chmod 0440 /etc/sudoers.d/perry-system

          mkdir -p /etc/lightdm/lightdm.conf.d /home/perry-system/.config/openbox /home/perry-system/Desktop
          printf '[Seat:*]\nautologin-user=perry-system\nautologin-user-timeout=0\nuser-session=openbox\n' > /etc/lightdm/lightdm.conf.d/99-perry.conf

          cat << 'AUTOEOF' > /home/perry-system/.config/openbox/autostart
          python3 /usr/local/bin/perry-explorer.py &
          if [ ! -f "$HOME/.perry_welcome_done" ]; then
            python3 /usr/local/bin/yonata-welcome.py &
          fi
          AUTOEOF

          cat << 'DESKEOF' > /home/perry-system/Desktop/Yonata.desktop
          [Desktop Entry]
          Type=Application
          Name=Yonata Instalador
          Exec=python3 /usr/local/bin/yonata-welcome.py
          Icon=utilities-terminal
          Terminal=false
          DESKEOF

          chmod +x /usr/local/bin/yonata-welcome.py /usr/local/bin/perry-explorer.py /usr/local/bin/perry-panel.py /home/perry-system/Desktop/Yonata.desktop
          chown -R perry-system:perry-system /home/perry-system

          grub-install --target=i386-pc --boot-directory=/boot "$LOOP_DEV"
          update-grub

          UUID=$(blkid -s UUID -o value "$PART_DEV" || true)
          if [ -n "$UUID" ] && [ ! -s /boot/grub/grub.cfg ]; then
            cat << GRUBEOF > /boot/grub/grub.cfg
          set default=0
          set timeout=1
          serial --unit=0 --speed=115200
          terminal_input serial console
          terminal_output serial console
          menuentry "Perry Pi OS (Normal 64-bit)" {
              search --no-floppy --fs-uuid --set=root $UUID
              linux /boot/vmlinuz-6.1.0*-amd64 root=UUID=$UUID ro console=ttyS0,115200 console=tty0
              initrd /boot/initrd.img-6.1.0*-amd64
          }
          GRUBEOF
          fi

          apt-get clean
          rm -rf /var/lib/apt/lists/*
          CHROOTEOF

      - name: Subir artefacto Normal 64-bit
        uses: actions/upload-artifact@v4
        with:
          name: perry-pi-os-normal
          path: perry-pi-os-normal-x64.img

  publish-release:
    name: 4. Publicar todo en GitHub Releases
    needs: [build-web-32bit, build-iso-64bit, build-normal-64bit]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Descargar artefactos disponibles
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Comprimir imágenes (.img -> .img.gz) y preparar release
        run: |
          set -euo pipefail
          mkdir -p release-assets
          shopt -s nullglob
          imgs=(release-assets/*.img)
          if [ "${#imgs[@]}" -gt 0 ]; then
            for f in "${imgs[@]}"; do
              gzip -9 -f "$f"
            done
          fi
          ls -lh release-assets/ || true

      - name: Publicar en Release (latest)
        if: hashFiles('release-assets/*') != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Perry Pi OS - Última Compilación
          draft: false
          prerelease: false
          files: release-assets/*
