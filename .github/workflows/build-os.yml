name: Compilar Perry Pi OS (Web 32-bit, ISO 64-bit y Normal 64-bit)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "build/**"
      - ".github/workflows/build-os.yml"

permissions:
  contents: write

jobs:
  build-web-32bit:
    name: 1. Compilar Web 32-bit (i386 + Yonata)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar herramientas
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq debootstrap debian-archive-keyring grub-pc-bin parted dosfstools e2fsprogs

      - name: Construir perry-pi-os-web.img
        run: |
          set -euo pipefail
          IMG="perry-pi-os-web.img"
          LOOP_DEV=""

          cleanup() {
            set +e
            for d in run sys proc dev/pts dev; do
              sudo umount -lf "mnt/$d" 2>/dev/null || true
            done
            sudo umount -lf mnt 2>/dev/null || true
            if [ -n "${LOOP_DEV:-}" ]; then
              sudo losetup -d "$LOOP_DEV" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT

          dd if=/dev/zero of="$IMG" bs=1M count=2400 status=none
          parted -s "$IMG" mklabel msdos
          parted -s "$IMG" mkpart primary ext4 1MiB 100%
          parted -s "$IMG" set 1 boot on

          LOOP_DEV=$(sudo losetup --find --show --partscan "$IMG")
          PART_DEV="${LOOP_DEV}p1"
          sudo mkfs.ext4 -F -L "PERRY_WEB32" "$PART_DEV"

          mkdir -p mnt
          sudo mount "$PART_DEV" mnt

          sudo debootstrap --arch=i386 --variant=minbase bookworm mnt http://deb.debian.org/debian

          for d in dev dev/pts proc sys run; do
            sudo mount --bind "/$d" "mnt/$d"
          done

          cat << 'PYEOF' > yonata.py
          import tkinter as tk
          from tkinter import ttk
          import subprocess, threading, platform, os, shutil

          FLAG = os.path.expanduser("~/.perry_welcome_done")

          def hablar(t):
              if shutil.which("espeak-ng"):
                  threading.Thread(
                      target=lambda: subprocess.run(["espeak-ng", "-v", "es", "-s", "145", t], check=False),
                      daemon=True
                  ).start()

          class Yonata:
              def __init__(self, r):
                  self.r = r
                  r.title("Yonata - Asistente Oficial Perry Pi OS")
                  r.geometry("560x420")
                  r.configure(bg="#0f172a")
                  tk.Label(
                      r, text="Hola, soy Yonata",
                      font=("Sans", 19, "bold"), fg="#38bdf8", bg="#0f172a"
                  ).pack(pady=(28, 6))
                  tk.Label(
                      r, text="Perry Pi OS • Usuario: perry",
                      font=("Sans", 9), fg="#94a3b8", bg="#0f172a"
                  ).pack()
                  self.desc = tk.Label(
                      r, text="Asistente oficial de Perry Pi OS listo.",
                      font=("Sans", 11), fg="#e2e8f0", bg="#0f172a", wraplength=500
                  )
                  self.desc.pack(pady=14)
                  self.pb = ttk.Progressbar(r, length=400, mode="determinate")
                  self.pb.pack(pady=12)

                  btn_frame = tk.Frame(r, bg="#0f172a")
                  btn_frame.pack(pady=10)

                  self.btn = tk.Button(
                      btn_frame, text="Verificar Sistema", bg="#10b981", fg="#fff",
                      font=("Sans", 10, "bold"), relief="flat", padx=16, pady=8, command=self.run
                  )
                  self.btn.pack(side="left", padx=6)

                  self.term_btn = tk.Button(
                      btn_frame, text="Abrir Terminal", bg="#334155", fg="#fff",
                      font=("Sans", 10, "bold"), relief="flat", padx=14, pady=8,
                      command=lambda: subprocess.Popen(["lxterminal"], start_new_session=True)
                  )
                  self.term_btn.pack(side="left", padx=6)

                  r.after(500, lambda: hablar("Hola, soy Yonata, tu asistente oficial de Perry Pi OS."))

              def run(self):
                  self.btn.config(state="disabled")
                  self.desc.config(text=f"Arquitectura: {platform.machine()} | Navegador, Editor, Calculadora y Yonata listos.")
                  hablar("Verificando entorno base de Perry Pi OS.")
                  self.pb["value"] = 65
                  self.r.after(1200, self.done)

              def done(self):
                  self.pb["value"] = 100
                  self.desc.config(text="¡Perry Pi OS listo! Puedes abrir apps desde la barra o terminal.")
                  hablar("Todo está listo. Bienvenido a Perry Pi OS.")
                  with open(FLAG, "w", encoding="utf-8") as f:
                      f.write("ok")
                  self.btn.config(text="Ir al Escritorio", bg="#3b82f6", state="normal", command=self.r.destroy)

          if __name__ == "__main__":
              root = tk.Tk()
              Yonata(root)
              root.mainloop()
          PYEOF

          sudo cp yonata.py mnt/usr/local/bin/yonata-welcome.py

          sudo chroot mnt /bin/bash -s "$LOOP_DEV" "$PART_DEV" << 'CHROOTEOF'
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          LOOP_DEV="$1"
          PART_DEV="$2"

          echo "perry-pi-os" > /etc/hostname
          printf 'PRETTY_NAME="Perry Pi OS 1.0 (Web 32-bit)"\nNAME="Perry Pi OS"\nID=perrypios\n' > /etc/os-release

          apt-get update -qq
          apt-get install -y -qq --no-install-recommends linux-image-686
          apt-get clean
          apt-get install -y -qq --no-install-recommends \
            grub-pc xorg openbox lxterminal pcmanfm tint2 mousepad netsurf-gtk \
            galculator viewnior htop \
            python3 python3-tk espeak-ng lightdm sudo ca-certificates dbus-x11

          sed -i 's/GRUB_CMDLINE_LINUX_DEFAULT=.*/GRUB_CMDLINE_LINUX_DEFAULT="console=ttyS0,115200 console=tty0"/' /etc/default/grub
          sed -i 's/GRUB_TIMEOUT=.*/GRUB_TIMEOUT=1/' /etc/default/grub

          id -u perry >/dev/null 2>&1 || useradd -m -s /bin/bash -G sudo perry
          echo "perry:perry" | chpasswd
          echo "root:perry" | chpasswd

          mkdir -p /etc/lightdm/lightdm.conf.d /home/perry/.config/openbox /home/perry/Desktop
          printf '[Seat:*]\nautologin-user=perry\nautologin-user-timeout=0\n' > /etc/lightdm/lightdm.conf.d/autologin.conf

          cat << 'AUTOEOF' > /home/perry/.config/openbox/autostart
          tint2 &
          if [ ! -f "$HOME/.perry_welcome_done" ]; then
            python3 /usr/local/bin/yonata-welcome.py &
          fi
          AUTOEOF

          cat << 'DESKEOF' > /home/perry/Desktop/Yonata.desktop
          [Desktop Entry]
          Type=Application
          Name=Yonata Asistente
          Exec=python3 /usr/local/bin/yonata-welcome.py
          Icon=utilities-terminal
          Terminal=false
          DESKEOF

          chmod +x /usr/local/bin/yonata-welcome.py /home/perry/Desktop/Yonata.desktop
          chown -R perry:perry /home/perry

          grub-install --target=i386-pc --boot-directory=/boot "$LOOP_DEV"
          update-grub

          UUID=$(blkid -s UUID -o value "$PART_DEV" || true)
          if [ -n "$UUID" ] && [ ! -s /boot/grub/grub.cfg ]; then
            cat << GRUBEOF > /boot/grub/grub.cfg
          set default=0
          set timeout=1
          serial --unit=0 --speed=115200
          terminal_input serial console
          terminal_output serial console
          menuentry "Perry Pi OS (Web 32-bit)" {
              search --no-floppy --fs-uuid --set=root $UUID
              linux /boot/vmlinuz-6.1.0-50-686 root=UUID=$UUID ro console=ttyS0,115200 console=tty0
              initrd /boot/initrd.img-6.1.0-50-686
          }
          GRUBEOF
          fi

          apt-get clean
          rm -rf /var/lib/apt/lists/*
          CHROOTEOF

      - name: Subir artefacto Web 32-bit
        uses: actions/upload-artifact@v4
        with:
          name: perry-pi-os-web
          path: perry-pi-os-web.img

  build-iso-64bit:
    name: 2. Compilar Local ISO 64-bit (amd64 + Chromium + Apps + Yonata)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar live-build y herramientas
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq live-build debian-archive-keyring squashfs-tools xorriso

      - name: Compilar perry-pi-os-local-x64.iso
        run: |
          set -euo pipefail
          rm -rf iso-build
          mkdir -p iso-build/config/package-lists \
            iso-build/config/includes.chroot_after_packages/usr/local/bin \
            iso-build/config/includes.chroot_after_packages/etc/lightdm/lightdm.conf.d \
            iso-build/config/includes.chroot_after_packages/home/perry/.config/openbox \
            iso-build/config/includes.chroot_after_packages/home/perry/Desktop
          cd iso-build

          lb config --mode debian --architecture amd64 --distribution bookworm \
            --mirror-bootstrap http://deb.debian.org/debian \
            --mirror-chroot http://deb.debian.org/debian \
            --mirror-binary http://deb.debian.org/debian \
            --security false \
            --apt-indices false \
            --linux-packages "none" \
            --binary-images iso-hybrid \
            --bootappend-live "boot=live components username=perry hostname=perry-pi-os"

          echo 'APT_INDICES="false"' >> config/chroot

          cat << 'EOF' > config/package-lists/perry.list.chroot
          linux-image-amd64 xorg openbox lxterminal pcmanfm tint2 mousepad chromium galculator viewnior htop python3 python3-tk espeak-ng lightdm sudo dbus-x11
          EOF

          cat << 'PYEOF' > config/includes.chroot_after_packages/usr/local/bin/yonata-welcome.py
          import tkinter as tk
          from tkinter import ttk
          import subprocess, threading, platform, os, shutil

          FLAG = os.path.expanduser("~/.perry_welcome_done")

          def hablar(t):
              if shutil.which("espeak-ng"):
                  threading.Thread(
                      target=lambda: subprocess.run(["espeak-ng", "-v", "es", "-s", "145", t], check=False),
                      daemon=True
                  ).start()

          class Yonata:
              def __init__(self, r):
                  self.r = r
                  r.title("Yonata - Asistente Oficial Perry Pi OS")
                  r.geometry("560x420")
                  r.configure(bg="#0f172a")
                  tk.Label(
                      r, text="Hola, soy Yonata",
                      font=("Sans", 19, "bold"), fg="#38bdf8", bg="#0f172a"
                  ).pack(pady=(28, 6))
                  tk.Label(
                      r, text="Perry Pi OS • Usuario: perry",
                      font=("Sans", 9), fg="#94a3b8", bg="#0f172a"
                  ).pack()
                  self.desc = tk.Label(
                      r, text="Asistente oficial de Perry Pi OS listo.",
                      font=("Sans", 11), fg="#e2e8f0", bg="#0f172a", wraplength=500
                  )
                  self.desc.pack(pady=14)
                  self.pb = ttk.Progressbar(r, length=400, mode="determinate")
                  self.pb.pack(pady=12)

                  btn_frame = tk.Frame(r, bg="#0f172a")
                  btn_frame.pack(pady=10)

                  self.btn = tk.Button(
                      btn_frame, text="Verificar Sistema", bg="#10b981", fg="#fff",
                      font=("Sans", 10, "bold"), relief="flat", padx=16, pady=8, command=self.run
                  )
                  self.btn.pack(side="left", padx=6)

                  self.term_btn = tk.Button(
                      btn_frame, text="Abrir Terminal", bg="#334155", fg="#fff",
                      font=("Sans", 10, "bold"), relief="flat", padx=14, pady=8,
                      command=lambda: subprocess.Popen(["lxterminal"], start_new_session=True)
                  )
                  self.term_btn.pack(side="left", padx=6)

                  r.after(500, lambda: hablar("Hola, soy Yonata, tu asistente oficial de Perry Pi OS."))

              def run(self):
                  self.btn.config(state="disabled")
                  self.desc.config(text=f"Arquitectura: {platform.machine()} | Chromium, Editor, Calculadora y Yonata listos.")
                  hablar("Verificando entorno base de Perry Pi OS.")
                  self.pb["value"] = 65
                  self.r.after(1200, self.done)

              def done(self):
                  self.pb["value"] = 100
                  self.desc.config(text="¡Perry Pi OS listo! Puedes instalar lo que elijas desde terminal.")
                  hablar("Todo está listo. Bienvenido a Perry Pi OS.")
                  with open(FLAG, "w", encoding="utf-8") as f:
                      f.write("ok")
                  self.btn.config(text="Ir al Escritorio", bg="#3b82f6", state="normal", command=self.r.destroy)

          if __name__ == "__main__":
              root = tk.Tk()
              Yonata(root)
              root.mainloop()
          PYEOF

          printf '[Seat:*]\nautologin-user=perry\nautologin-user-timeout=0\n' > config/includes.chroot_after_packages/etc/lightdm/lightdm.conf.d/autologin.conf

          cat << 'AUTOEOF' > config/includes.chroot_after_packages/home/perry/.config/openbox/autostart
          tint2 &
          if [ ! -f "$HOME/.perry_welcome_done" ]; then
            python3 /usr/local/bin/yonata-welcome.py &
          fi
          AUTOEOF

          cat << 'DESKEOF' > config/includes.chroot_after_packages/home/perry/Desktop/Yonata.desktop
          [Desktop Entry]
          Type=Application
          Name=Yonata Asistente
          Exec=python3 /usr/local/bin/yonata-welcome.py
          Icon=utilities-terminal
          Terminal=false
          DESKEOF

          chmod +x config/includes.chroot_after_packages/usr/local/bin/yonata-welcome.py \
                   config/includes.chroot_after_packages/home/perry/Desktop/Yonata.desktop

          sudo lb build
          mv live-image-amd64.hybrid.iso ../perry-pi-os-local-x64.iso

      - name: Subir artefacto ISO 64-bit
        uses: actions/upload-artifact@v4
        with:
          name: perry-pi-os-iso
          path: perry-pi-os-local-x64.iso

