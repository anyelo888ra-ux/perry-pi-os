  publish-release:
    name: 4. Publicar todo en GitHub Releases
    needs: [build-web-32bit, build-iso-64bit, build-normal-64bit]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Descargar artefactos disponibles
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: release-assets
          merge-multiple: true

      - name: Comprimir imágenes (.img -> .img.gz) y preparar release
        run: |
          set -euo pipefail
          mkdir -p release-assets
          shopt -s nullglob
          imgs=(release-assets/*.img)
          if [ "${#imgs[@]}" -gt 0 ]; then
            for f in "${imgs[@]}"; do
              gzip -9 -f "$f"
            done
          fi
          ls -lh release-assets/ || true

      - name: Publicar en Release (latest)
        if: hashFiles('release-assets/*') != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Perry Pi OS - Última Compilación
          draft: false
          prerelease: false
          files: release-assets/*
